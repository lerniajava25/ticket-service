spring.application.name=ticket-service

# Stäng av automatisk compose-sökning
spring.docker.compose.enabled=false

# Anslutning till min manuellt startade Podman-container
spring.datasource.url=jdbc:mysql://localhost:3306/helpdesk_db?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=verysecret

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Läs in din lokala .env-fil (ignorera om den saknas i produktion)
spring.config.import=optional:file:.env[.properties]

# Hämta lösenorden enbart från miljövariabler
app.init.user-password=${USER_PASSWORD}
app.init.agent-password=${AGENT_PASSWORD}
app.init.admin-password=${ADMIN_PASSWORD}







